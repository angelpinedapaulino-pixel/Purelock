name: Construir y publicar PureLock (firma de producción)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write        # crear el Release
  id-token: write        # atestación de procedencia
  attestations: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v4

      - name: Exigir secretos de firma (nunca se publica un APK sin firma de producción)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
          AL: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KS PW AL KP; do
            if [ -z "${!v}" ]; then
              echo "::error::Faltan secretos de firma: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done

      - name: Preparar keystore (solo existe durante este trabajo)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$KS" | tr -d ' \r\n\t"' | base64 -d > "$RUNNER_TEMP/release.jks" || { echo "::error::KEYSTORE_BASE64 no es base64 válido. Vuelve a copiarlo completo."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW" > /dev/null || { echo "::error::El keystore no abre: KEYSTORE_PASSWORD no coincide o el archivo está dañado."; exit 1; }
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK de release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verificar firma, permisos y calcular hashes
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee sign.txt
          if grep -qi "Android Debug" sign.txt; then echo "::error::El APK está firmado con clave debug"; exit 1; fi
          cp "$APK" PureLock.apk
          "$BT/aapt2" dump permissions PureLock.apk | tee perms.txt
          if grep -Eqi "INTERNET|SMS|CONTACTS|CALL_|STORAGE|LOCATION|ACCESSIBILITY|BIND_VPN" perms.txt; then
            echo "::error::El APK pide permisos que no deberían estar"; exit 1
          fi
          sha256sum PureLock.apk | tee sha.txt
          {
            echo "## PureLock build ${{ github.run_number }}"
            echo
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- SHA-256 del APK: \`$(cut -d' ' -f1 sha.txt)\`"
            echo "- Certificado de firma: \`$(grep -m1 'certificate SHA-256 digest' sign.txt | sed 's/.*: //')\`"
            echo "- Permisos declarados: solo RECEIVE_BOOT_COMPLETED"
            echo
            echo "Verificar en tu computadora: \`sha256sum PureLock.apk\` debe coincidir, y \`gh attestation verify PureLock.apk -R ${{ github.repository }}\` debe confirmar que salió de este repositorio y commit."
          } > notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: PureLock-apk
          path: |
            PureLock.apk
            sha.txt
            perms.txt

      - name: Atestación de procedencia (comprueba que el APK sale de este commit)
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: PureLock.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" PureLock.apk sha.txt \
            --title "PureLock build ${{ github.run_number }}" \
            --notes-file notes.md --latest
