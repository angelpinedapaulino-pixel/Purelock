      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Compilar APK corregido
        working-directory: source/PureLock
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PureLock-corregido
          path: source/PureLock/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp source/PureLock/app/build/outputs/apk/debug/app-debug.apk PureLock-corregido.apk
          gh release create "purelock-fixed-${{ github.run_id }}" PureLock-corregido.apk \
            --title "PureLock corregido ${{ github.run_number }}" \
            --notes "Versión sin VPN: conserva Android Private DNS de CleanBrowsing. Requiere pruebas en dispositivo físico." \
            --latest --repo "$GITHUB_REPOSITORY"
