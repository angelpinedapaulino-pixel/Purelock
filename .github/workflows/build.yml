name: Construir PureLock APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v4
      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PureLock-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar en Releases (enlace de descarga directo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PureLock.apk
          gh release create "build-${{ github.run_number }}" PureLock.apk \
            --title "PureLock build ${{ github.run_number }}" \
            --notes "APK de depuración firmado con la clave debug. Instálalo y sigue el README." \
            --latest
