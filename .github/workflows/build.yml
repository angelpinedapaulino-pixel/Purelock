          unzip -q /tmp/purelock.zip -d /tmp/purelock-src
          cp -a /tmp/purelock-src/PureLock/. .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PureLock-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PureLock.apk
          gh release create "build-${{ github.run_id }}" PureLock.apk --title "PureLock build ${{ github.run_number }}" --notes "APK de PureLock generado automáticamente." --latest
